<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card shadow-lg border-0 rounded-lg p-3">
            <div class="card-body text-center">
                <h5 class="card-title fw-bold text-primary">
                    <i class="fas fa-chart-pie"></i> Category Distribution
                </h5>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card shadow-lg border-0 rounded-lg p-3">
            <div class="card-body text-center">
                <h5 class="card-title fw-bold text-success">
                    <i class="fas fa-chart-line"></i> Sales Over Time
                </h5>
                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Pie Chart
    var ctxPie = document.getElementById('pieChart').getContext('2d');
    var pieChart = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            labels: {{ categories|safe }},
            datasets: [{
                data: {{ category_counts|safe }},
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#8E5EA2'],
                borderWidth: 2,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        usePointStyle: true,
                        padding: 15,
                        font: {
                            size: 14
                        }
                    }
                },
                tooltip: {
                    backgroundColor: "rgba(0,0,0,0.7)",
                    titleColor: "#fff",
                    bodyColor: "#fff",
                    padding: 10,
                    callbacks: {
                        label: function(tooltipItem) {
                            return tooltipItem.label + ': ' + tooltipItem.raw;
                        }
                    }
                },
                title: {
                    display: true,
                    text: 'Category Distribution',
                    font: {
                        size: 18,
                        weight: 'bold'
                    },
                    color: "#444"
                }
            },
            cutout: '60%',
            maintainAspectRatio: false
        }
    });

    // Line Chart
    var ctxLine = document.getElementById('lineChart').getContext('2d');
    var lineChart = new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: {{ sale_dates_labels|safe }},
            datasets: [{
                label: 'Sales',
                data: {{ sale_dates_values|safe }},
                fill: true,
                borderColor: '#4BC0C0',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                tension: 0.4,
                pointRadius: 5,
                pointHoverRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: {
                            size: 14
                        }
                    }
                },
                tooltip: {
                    backgroundColor: "rgba(0,0,0,0.7)",
                    titleColor: "#fff",
                    bodyColor: "#fff",
                    padding: 10,
                    callbacks: {
                        label: function(tooltipItem) {
                            return 'Sales: ' + tooltipItem.raw;
                        }
                    }
                },
                title: {
                    display: true,
                    text: 'Sales Over Time',
                    font: {
                        size: 18,
                        weight: 'bold'
                    },
                    color: "#444"
                }
            },
            maintainAspectRatio: false
        }
    });
</script>

<style>
.chart-container {
    position: relative;
    width: 100%;
    height: 400px;
}

.card {
    transition: transform 0.3s ease-in-out;
}

.card:hover {
    transform: scale(1.05);
}

.card-title {
    font-size: 1.3rem;
}

#pieChart, #lineChart {
    max-width: 100%;
    height: 100%;
}
</style>
